<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Touch Test 2 - Pig Layout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        /* Basic Setup */
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Align content to the bottom */
        }

        /* Disable selection and tap highlight */
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Display Area for Pressed Sequence */
        #display {
            width: 100%;
            height: 100px;
            padding: 20px;
            box-sizing: border-box;
            background-color: #222;
            border-top: 1px solid #555;
            font-size: 1.5em;
            text-align: center;
            overflow-wrap: break-word;
        }

        /* Button Container (similar to floor-container) */
        .button-area {
            position: relative;
            width: 100%;
            max-width: 350px; /* Match app width */
            height: 255px;
            margin: 0 auto; /* Center the area */
            background-color: #111;
            border: 2px solid #444;
            box-sizing: border-box;
        }

        .button-layout-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Test Buttons */
        .test-button {
            position: absolute;
            width: 75px;
            height: 75px;
            background-color: #5a5a5a;
            color: white;
            border: 1px solid #888;
            border-radius: 50%; /* Make them round */
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation; /* Prevent zoom delay on iOS */
        }

        .test-button.pressed {
            background-color: #888;
            filter: brightness(1.2);
        }

        /* --- Pig Layout (Copied from style.css) --- */
        .pig-cmd1 { top: 20%; left: 28%; transform: translateX(-50%); }      /* Top point */
        .pig-cmd3 { bottom: 15%; left: 10%; }                                /* Bottom-left */
        .pig-cmd2 { bottom: 15%; left: 42%; transform: translateX(-50%); }  /* Bottom-right */
        .pig-cmd6 { bottom: 15%; right: 28%; transform: translateX(50%); }   /* Bottom point */
        .pig-item1 { top: 25%; right: 40%; transform: translateX(50%); }    /* Top-left */
        .pig-item2 { top: 25%; right: 8%; }                                 /* Top-right */

    </style>
</head>
<body>

    <div id="display"></div>

    <div class="button-area">
        <div class="button-layout-container">
            <button class="test-button pig-cmd1" data-value="1">1</button>
            <button class="test-button pig-cmd2" data-value="2">2</button>
            <button class="test-button pig-cmd3" data-value="3">3</button>
            <button class="test-button pig-cmd6" data-value="6">6</button>
            <button class="test-button pig-item1" data-value="i1">i1</button>
            <button class="test-button pig-item2" data-value="i2">i2</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const display = document.getElementById('display');

            function handleButtonPress(event) {
                // Prevent default browser actions like scrolling or zooming.
                event.preventDefault();

                // Iterate through the list of all touches that were released.
                // This is the key to handling multiple rapid/simultaneous taps.
                for (const touch of event.changedTouches) {
                    // Find what element is at the coordinates where the touch ended.
                    const element = document.elementFromPoint(touch.clientX, touch.clientY);

                    // Find the closest parent that is a button.
                    const button = element ? element.closest('.test-button') : null;

                    // If we found a button, process it.
                    if (button) {
                        const value = button.getAttribute('data-value');

                        // Append value to the display
                        display.textContent += value + ' ';

                        // Visual feedback
                        button.classList.add('pressed');
                        setTimeout(() => {
                            button.classList.remove('pressed');
                        }, 150);
                    }
                }
            }

            // Attach a single, delegated event listener to the body.
            document.body.addEventListener('touchend', handleButtonPress, { passive: false });
        });
    </script>

</body>
</html>
